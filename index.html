<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Patyczki dla Ciebie ❤️</title>

  <!-- Ustawienia PWA dla iPhone (tryb pełnoekranowy bez paska Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Patyczki ❤️" />
  <meta name="theme-color" content="#ffd6e5" />
  <link rel="apple-touch-icon" href="ikona.jpeg" />

  <!-- Czcionka z pełnym wsparciem polskich znaków -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-top: #ffe4ee;
      --bg-mid: #ffc8dd;
      --bg-bot: #ffafcc;
      --accent: #e63973;
      --accent-dark: #c92a60;
      --wood-1: #f6dcb8;
      --wood-2: #edd0a6;
      --wood-3: #e2be8d;
      --wood-border: #cfa46e;
      --wood-text: #5c3a21;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bot) 100%);
      color: #6b213c;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 22px);
      position: relative;
    }

    /* Subtelne pływające serduszka w tle */
    .bg-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-heart {
      position: absolute;
      bottom: -40px;
      font-size: 20px;
      opacity: 0.25;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.9);
        opacity: 0;
      }
      15% {
        opacity: 0.28;
      }
      85% {
        opacity: 0.22;
      }
      100% {
        transform: translateY(-110vh) rotate(25deg) scale(1.1);
        opacity: 0;
      }
    }

    /* Górny pasek (bez licznika, tylko przycisk dźwięku po prawej) */
    header {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 2;
      max-width: 440px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.78);
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #8f2d52;
      box-shadow: 0 4px 15px rgba(230, 57, 115, 0.12);
      transition: transform 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* Główna strefa centralna */
    main {
      flex: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      gap: 24px;
    }

    /* Scena prezentacji zdjęcia i patyczka */
    .stage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      gap: 18px;
      min-height: 140px;
    }

    .jar-glow {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 72%);
      pointer-events: none;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .jar-glow.pulse {
      animation: glowPulse 0.7s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from { transform: scale(0.95); opacity: 0.7; }
      to { transform: scale(1.22); opacity: 1; }
    }

    /* Ramka Polaroid na wspólne zdjęcie */
    .photo-card {
      display: none;
      background: #ffffff;
      padding: 10px 10px 26px 10px;
      border-radius: 16px;
      box-shadow:
        0 14px 30px rgba(138, 43, 77, 0.22),
        0 2px 6px rgba(0, 0, 0, 0.06);
      transform: scale(0.85) rotate(2deg);
      opacity: 0;
      transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.22, 1.25, 0.36, 1);
      cursor: zoom-in;
      position: relative;
      z-index: 2;
    }

    .photo-card.has-photo {
      display: block;
    }

    .photo-card.visible {
      opacity: 1;
      transform: scale(1) rotate(2deg);
    }

    .photo-card img {
      width: 205px;
      height: 205px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      background: #ffe4ee;
    }

    .photo-caption {
      position: absolute;
      bottom: 5px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      color: #b5486e;
      letter-spacing: 0.3px;
    }

    /* Drewniany patyczek */
    .stick-wrapper {
      width: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: translateY(35px) scale(0.84) rotate(-4deg);
      transition: opacity 0.35s ease, transform 0.55s cubic-bezier(0.22, 1.25, 0.36, 1);
      z-index: 3;
    }

    .stick-wrapper.active {
      display: flex;
    }

    .stick-wrapper.visible {
      opacity: 1;
      transform: translateY(0) scale(1) rotate(-1.5deg);
    }

    .stick-wrapper.drawing {
      display: flex;
      animation: stickShuffle 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes stickShuffle {
      0%   { opacity: 0.9; transform: translateY(16px) scale(0.85) rotate(-8deg); }
      20%  { opacity: 1;   transform: translateY(-16px) scale(0.92) rotate(7deg); }
      40%  { opacity: 1;   transform: translateY(10px) scale(0.95) rotate(-6deg); }
      60%  { opacity: 1;   transform: translateY(-12px) scale(0.97) rotate(5deg); }
      80%  { opacity: 1;   transform: translateY(6px) scale(0.99) rotate(-3deg); }
      100% { opacity: 0;   transform: translateY(-20px) scale(0.9) rotate(0deg); }
    }

    .popsicle-stick {
      position: relative;
      width: 100%;
      max-width: 365px;
      min-height: 86px;
      padding: 18px 34px;
      border-radius: 999px;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(185, 134, 75, 0.06) 0px,
          rgba(185, 134, 75, 0.06) 2px,
          transparent 2px,
          transparent 9px
        ),
        linear-gradient(180deg, var(--wood-1) 0%, var(--wood-2) 55%, var(--wood-3) 100%);
      border: 2px solid var(--wood-border);
      box-shadow:
        0 14px 28px rgba(138, 43, 77, 0.22),
        0 4px 0 #c5965d,
        inset 0 2px 4px rgba(255, 255, 255, 0.75),
        inset 0 -3px 6px rgba(168, 118, 62, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .popsicle-stick::before,
    .popsicle-stick::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(168, 118, 62, 0.22);
      box-shadow: inset 0 1px 2px rgba(92, 58, 33, 0.25);
    }

    .popsicle-stick::before {
      left: 16px;
    }

    .popsicle-stick::after {
      right: 16px;
    }

    .stick-text {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.3;
      color: var(--wood-text);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      word-break: break-word;
    }

    .stick-text.long-text {
      font-size: 17.5px;
    }

    /* Strefa przycisku "Losuj" i limitu dziennego */
    .controls-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .draw-btn {
      position: relative;
      min-width: 215px;
      height: 74px;
      padding: 0 44px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff5c93 0%, var(--accent) 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow:
        0 12px 26px rgba(230, 57, 115, 0.38),
        0 5px 0 var(--accent-dark),
        inset 0 2px 3px rgba(255, 255, 255, 0.45);
      transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .draw-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow:
        0 6px 14px rgba(230, 57, 115, 0.32),
        0 1px 0 var(--accent-dark),
        inset 0 2px 3px rgba(255, 255, 255, 0.35);
    }

    .draw-btn:disabled {
      cursor: default;
      filter: saturate(0.85);
    }

    .draw-btn.shaking {
      animation: btnShake 0.65s ease-in-out;
    }

    @keyframes btnShake {
      0%, 100% { transform: scale(1) rotate(0deg); }
      15% { transform: scale(1.05) rotate(-4deg); }
      30% { transform: scale(1.05) rotate(4deg); }
      45% { transform: scale(1.05) rotate(-4deg); }
      60% { transform: scale(1.05) rotate(4deg); }
      75% { transform: scale(1.03) rotate(-2deg); }
    }

    .daily-hint {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      color: #8f2d52;
    }

    /* Komunikat po wykorzystaniu 3 patyczków na dziś */
    .limit-card {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      padding: 16px 22px;
      box-shadow: 0 10px 26px rgba(230, 57, 115, 0.16);
      max-width: 340px;
      gap: 4px;
    }

    .limit-card.show {
      display: flex;
      animation: popIn 0.4s cubic-bezier(0.22, 1.25, 0.36, 1);
    }

    .limit-card strong {
      font-size: 16px;
      font-weight: 900;
      color: #c92a60;
    }

    .limit-card span {
      font-size: 14px;
      font-weight: 700;
      color: #7d2244;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Podgląd zdjęcia na pełnym ekranie po kliknięciu */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(45, 12, 25, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 82dvh;
      border-radius: 18px;
      border: 6px solid #ffffff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      object-fit: contain;
    }

    /* Cząsteczki po wylosowaniu */
    .particle {
      position: fixed;
      pointer-events: none;
      font-size: 22px;
      z-index: 20;
      animation: burst 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes burst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.5);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.25) rotate(var(--rot));
      }
    }

    /* Mniejsze ekrany */
    @media (max-height: 700px) {
      .photo-card img {
        width: 165px;
        height: 165px;
      }
      main {
        gap: 16px;
      }
      .draw-btn {
        height: 64px;
        font-size: 24px;
      }
    }
  </style>
</head>

      "Uwielbiam Twój śmiech! 😂❤️",
      "Przy Tobie czuję się jak w domu! 🏡",
      "Jesteś moim ulubionym powiadomieniem na telefonie! 📱❤️",
      "Jeszcze tyle pięknych chwil przed nami! ✨",
      "Jak dobrze, że nasze drogi się spotkały! 💍❤️"
    ];

    const LIMIT_DZIENNY = 3;
    const STORAGE_DRAWN_KEY = "patyczki_wylosowane_v2";
    const STORAGE_PHOTOS_KEY = "patyczki_zdjecia_v2";
    const STORAGE_DAILY_KEY = "patyczki_dzis_v2";
    const SOUND_KEY = "patyczki_dzwiek_v1";

    // Zwraca dzisiejszą datę w lokalnej strefie czasowej (np. "2026-11-26")
    function getTodayKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    let drawnIndices = JSON.parse(localStorage.getItem(STORAGE_DRAWN_KEY) || "[]")
      .filter(i => Number.isInteger(i) && i >= 0 && i < PATYCZKI.length);

    let drawnPhotos = JSON.parse(localStorage.getItem(STORAGE_PHOTOS_KEY) || "[]")
      .filter(i => Number.isInteger(i) && i >= 0 && i < ZDJECIA.length);

    function loadDailyState() {
      const today = getTodayKey();
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_DAILY_KEY) || "null");
        if (saved && saved.date === today) {
          return {
            date: today,
            count: Math.min(LIMIT_DZIENNY, Math.max(0, Number(saved.count) || 0)),
            lastMessage: saved.lastMessage || "",
            lastPhoto: saved.lastPhoto || ""
          };
        }
      } catch (e) {}
      return { date: today, count: 0, lastMessage: "", lastPhoto: "" };
    }

    let dailyState = loadDailyState();
    let soundEnabled = localStorage.getItem(SOUND_KEY) !== "false";
    let isDrawing = false;

    const drawBtn = document.getElementById("drawBtn");
    const dailyHint = document.getElementById("dailyHint");
    const limitCard = document.getElementById("limitCard");
    const stickWrapper = document.getElementById("stickWrapper");
    const stickText = document.getElementById("stickText");
    const photoCard = document.getElementById("photoCard");
    const photoImg = document.getElementById("photoImg");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const soundToggle = document.getElementById("soundToggle");
    const jarGlow = document.getElementById("jarGlow");

    // Subtelne pływające serduszka w tle
    function initBgHearts() {
      const container = document.getElementById("bgHearts");
      const icons = ["💗", "💖", "💕", "🌸", "✨"];
      for (let i = 0; i < 14; i++) {
        const el = document.createElement("div");
        el.className = "bg-heart";
        el.textContent = icons[i % icons.length];
        el.style.left = `${Math.random() * 94 + 3}%`;
        el.style.animationDuration = `${11 + Math.random() * 10}s`;
        el.style.animationDelay = `${-Math.random() * 15}s`;
        el.style.fontSize = `${15 + Math.random() * 12}px`;
        container.appendChild(el);
      }
    }

    // Dźwięki generowane przez Web Audio API
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playWoodTap(delay = 0, freq = 260) {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const t = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(110, t + 0.06);

      gain.gain.setValueAtTime(0.14, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.08);
    }

    function playRevealChime() {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, idx) => {
        const t = ctx.currentTime + idx * 0.065;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.12, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.45);
      });
    }

    function spawnParticles() {
      const rect = stickWrapper.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const emojis = ["❤️", "💖", "✨", "🥰", "💕"];

      for (let i = 0; i < 12; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.textContent = emojis[i % emojis.length];
        const angle = (Math.PI * 2 * i) / 12 + (Math.random() - 0.5) * 0.4;
        const dist = 65 + Math.random() * 85;
        p.style.left = `${cx}px`;
        p.style.top = `${cy}px`;
        p.style.setProperty("--tx", `${Math.cos(angle) * dist}px`);
        p.style.setProperty("--ty", `${Math.sin(angle) * dist - 20}px`);
        p.style.setProperty("--rot", `${(Math.random() - 0.5) * 70}deg`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
      }
    }

    function showPhoto(src, animate = true) {
      if (!src) {
        photoCard.classList.remove("has-photo", "visible");
        return;
      }
      const loader = new Image();
      loader.onload = () => {
        photoImg.src = src;
        lightboxImg.src = src;
        photoCard.classList.add("has-photo");
        if (animate) {
          photoCard.classList.remove("visible");
          requestAnimationFrame(() => {
            requestAnimationFrame(() => photoCard.classList.add("visible"));
          });
        } else {
          photoCard.classList.add("visible");
        }
      };
      loader.onerror = () => {
        // Jeśli zdjęcie nie istnieje lub nazwa pliku ma literówkę, ukryj ramkę bez błędu
        photoCard.classList.remove("has-photo", "visible");
      };
      loader.src = src;
    }

    function showStick(message, animate = true) {
      if (!message) return;
      stickText.textContent = message;
      stickText.classList.toggle("long-text", message.length > 34);
      const tilt = (Math.random() * 3.6 - 1.8).toFixed(2);
      stickWrapper.classList.add("active");
      if (animate) {
        stickWrapper.classList.remove("visible");
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            stickWrapper.classList.add("visible");
            stickWrapper.style.transform = `translateY(0) scale(1) rotate(${tilt}deg)`;
          });
        });
      } else {
        stickWrapper.classList.add("visible");
        stickWrapper.style.transform = `translateY(0) scale(1) rotate(${tilt}deg)`;
      }
    }

    function updateUI() {
      // Odśwież stan dnia na wypadek, gdyby minęła północ przy otwartej aplikacji
      dailyState = loadDailyState();
      soundToggle.textContent = soundEnabled ? "🔊" : "🔇";

      const leftToday = Math.max(0, LIMIT_DZIENNY - dailyState.count);

      if (leftToday === 0) {
        drawBtn.style.display = "none";
        dailyHint.style.display = "none";
        limitCard.classList.add("show");
      } else {
        drawBtn.style.display = "flex";
        dailyHint.style.display = "block";
        limitCard.classList.remove("show");
        const word = leftToday === 1 ? "losowanie" : "losowania";
        dailyHint.textContent = `Dziś pozostało: ${leftToday} z ${LIMIT_DZIENNY} ${word} 💕`;
      }
    }

    function pickNextPhoto() {
      if (!Array.isArray(ZDJECIA) || ZDJECIA.length === 0) return "";
      let availablePhotos = [];
      for (let i = 0; i < ZDJECIA.length; i++) {
        if (!drawnPhotos.includes(i)) availablePhotos.push(i);
      }
      if (availablePhotos.length === 0) {
        drawnPhotos = [];
        availablePhotos = ZDJECIA.map((_, i) => i);
      }
      const chosenPhotoIdx = availablePhotos[Math.floor(Math.random() * availablePhotos.length)];
      drawnPhotos.push(chosenPhotoIdx);
      localStorage.setItem(STORAGE_PHOTOS_KEY, JSON.stringify(drawnPhotos));
      return ZDJECIA[chosenPhotoIdx];
    }

    function drawStick() {
      if (isDrawing) return;

      dailyState = loadDailyState();
      if (dailyState.count >= LIMIT_DZIENNY) {
        updateUI();
        return;
      }

      // Wybór niepowtarzającego się patyczka (automatyczne uzupełnienie po wylosowaniu wszystkich 102)
      let available = [];
      for (let i = 0; i < PATYCZKI.length; i++) {
        if (!drawnIndices.includes(i)) available.push(i);
      }
      if (available.length === 0) {
        drawnIndices = [];
        available = PATYCZKI.map((_, i) => i);
      }

      isDrawing = true;
      drawBtn.disabled = true;
      drawBtn.classList.add("shaking");
      jarGlow.classList.add("pulse");

      playWoodTap(0.02, 270);
      playWoodTap(0.16, 310);
      playWoodTap(0.30, 250);
      playWoodTap(0.44, 330);

      photoCard.classList.remove("visible");
      stickWrapper.classList.remove("visible");
      void stickWrapper.offsetWidth;
      stickWrapper.classList.add("drawing");

      const chosenIndex = available[Math.floor(Math.random() * available.length)];
      const message = PATYCZKI[chosenIndex];
      const photoSrc = pickNextPhoto();

      setTimeout(() => {
        stickWrapper.classList.remove("drawing");

        drawnIndices.push(chosenIndex);
        localStorage.setItem(STORAGE_DRAWN_KEY, JSON.stringify(drawnIndices));

        dailyState = {
          date: getTodayKey(),
          count: dailyState.count + 1,
          lastMessage: message,
          lastPhoto: photoSrc
        };
        localStorage.setItem(STORAGE_DAILY_KEY, JSON.stringify(dailyState));

        showPhoto(photoSrc, true);
        showStick(message, true);

        playRevealChime();
        spawnParticles();

        drawBtn.classList.remove("shaking");
        jarGlow.classList.remove("pulse");
        drawBtn.disabled = false;
        isDrawing = false;

        updateUI();
      }, 680);
    }

    drawBtn.addEventListener("click", drawStick);

    photoCard.addEventListener("click", () => {
      if (photoImg.src) lightbox.classList.add("open");
    });

    lightbox.addEventListener("click", () => {
      lightbox.classList.remove("open");
    });

    soundToggle.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem(SOUND_KEY, String(soundEnabled));
      updateUI();
      if (soundEnabled) playWoodTap(0, 320);
    });

    // Przywrócenie ostatnio wylosowanego dziś patyczka i zdjęcia po ponownym otwarciu aplikacji
    if (dailyState.count > 0 && dailyState.lastMessage) {
      showPhoto(dailyState.lastPhoto, false);
      showStick(dailyState.lastMessage, false);
    }

    initBgHearts();
    updateUI();
  </script>
</body>
</html>
