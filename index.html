<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <!-- Konfiguracja widoku i pełnego ekranu dla iPhone (PWA / Safari) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Patyczki ❤️">
  <meta name="theme-color" content="#ffe4ee">
  <!-- Opcjonalna ikona na ekran główny iPhone'a (jeśli dodasz plik ikona.png do repozytorium) -->
  <link rel="apple-touch-icon" href="ikona.jpeg" />

  <title>Słoik z Patyczkami ❤️</title>

  <!-- Zaokrąglona, przyjazna czcionka z pełną obsługą polskich znaków -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       ZMIENNE KOLORYSTYCZNE I RESET
       ========================================================================== */
    :root {
      --bg-top: #ffe4ee;
      --bg-mid: #ffc8dd;
      --bg-bottom: #ffafcc;
      --pink-primary: #ff4d8d;
      --pink-primary-dark: #e03574;
      --pink-glow: rgba(255, 77, 141, 0.42);
      --text-dark: #5c1d36;
      --wood-light: #f6dec3;
      --wood-mid: #ebd0b0;
      --wood-dark: #d9b38c;
      --wood-ink: #4a2314;
      --glass-bg: rgba(255, 255, 255, 0.58);
      --glass-border: rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
      color: var(--text-dark);
    }

    /* ==========================================================================
       GŁÓWNY KONTENER Z UWZGLĘDNIENIEM SAFE-AREA IPHONE'A
       ========================================================================== */
    .app-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding-top: max(18px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      z-index: 2;
    }

    /* ==========================================================================
       TŁO Z DELIKATNYMI PŁYWAJĄCYMI SERDUSZKAMI
       ========================================================================== */
    .floating-hearts-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .bg-heart {
      position: absolute;
      bottom: -40px;
      opacity: 0;
      animation: floatUp linear infinite;
      filter: blur(0.3px);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      15% {
        opacity: 0.48;
      }
      85% {
        opacity: 0.42;
      }
      100% {
        transform: translateY(-112vh) translateX(var(--drift, 20px)) rotate(25deg) scale(1.1);
        opacity: 0;
      }
    }

    /* ==========================================================================
       GÓRNY PASEK: LICZNIK ORAZ PRZEŁĄCZNIK DŹWIĘKU
       ========================================================================== */
    .top-bar {
      width: 100%;
      max-width: 460px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 6px;
      z-index: 10;
    }

    .counter-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid var(--glass-border);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-dark);
      box-shadow: 0 8px 20px rgba(214, 70, 122, 0.12);
      transition: transform 0.25s ease;
    }

    .counter-pill.bump {
      transform: scale(1.07);
    }

    .sound-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.5px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(214, 70, 122, 0.12);
      transition: transform 0.18s ease, background 0.2s ease;
    }

    .sound-btn:active {
      transform: scale(0.9);
    }

    /* ==========================================================================
       CENTRALNA SCENA: PRZYCISK "LOSUJ" I WYSUWANY DREWNIANY PATYCZEK
       ========================================================================== */
    .center-stage {
      position: relative;
      width: 100%;
      max-width: 460px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    /* Dekoracyjna ikona słoiczka / serduszka nad przyciskiem w stanie początkowym */
    .jar-emblem {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .jar-icon {
      width: 84px;
      height: 84px;
      filter: drop-shadow(0 10px 18px rgba(224, 53, 116, 0.22));
      animation: gentleBob 3.2s ease-in-out infinite;
    }

    @keyframes gentleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .subtitle-hint {
      font-size: 0.95rem;
      font-weight: 700;
      color: rgba(92, 29, 54, 0.78);
      text-align: center;
    }

    /* Główny duży różowy przycisk "Losuj" */
    .draw-button {
      position: relative;
      min-width: 220px;
      padding: 22px 48px;
      border-radius: 999px;
      border: 3px solid rgba(255, 255, 255, 0.85);
      background: linear-gradient(145deg, #ff669e 0%, var(--pink-primary) 55%, var(--pink-primary-dark) 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow:
        0 14px 30px var(--pink-glow),
        inset 0 3px 6px rgba(255, 255, 255, 0.45);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      overflow: hidden;
      z-index: 5;
    }

    .draw-button::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 45%;
      height: 200%;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.35) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      animation: buttonShimmer 3.8s infinite;
    }

    @keyframes buttonShimmer {
      0% { left: -60%; }
      35%, 100% { left: 135%; }
    }

    .draw-button:active:not(:disabled) {
      transform: scale(0.94);
    }

    .draw-button:disabled {
      cursor: default;
    }

    /* Animacja potrząsania podczas losowania */
    .is-shaking {
      animation: shakeMotion 0.68s cubic-bezier(0.36, 0.07, 0.19, 0.97) both !important;
    }

    @keyframes shakeMotion {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      12% { transform: translate3d(-8px, -2px, 0) rotate(-4deg); }
      24% { transform: translate3d(9px, 2px, 0) rotate(4.5deg); }
      36% { transform: translate3d(-10px, -1px, 0) rotate(-5deg); }
      48% { transform: translate3d(10px, 1px, 0) rotate(5deg); }
      60% { transform: translate3d(-7px, -2px, 0) rotate(-3.5deg); }
      72% { transform: translate3d(7px, 2px, 0) rotate(3.5deg); }
      84% { transform: translate3d(-4px, 0, 0) rotate(-1.5deg); }
    }

    /* ==========================================================================
       DREWNIANY PATYCZEK (WYLOSOWANA WIADOMOŚĆ)
       ========================================================================== */
    .stick-wrapper {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      z-index: 6;
    }

    .stick-wrapper.visible {
      display: flex;
    }

    .wooden-stick {
      position: relative;
      width: min(92vw, 410px);
      min-height: 118px;
      padding: 24px 38px;
      border-radius: 999px;
      /* Realistyczna faktura drewna brzozowego z delikatnym usłojeniem */
      background:
        repeating-linear-gradient(
          -3deg,
          rgba(181, 131, 90, 0.07) 0px,
          rgba(181, 131, 90, 0.07) 2px,
          transparent 2px,
          transparent 9px
        ),
        linear-gradient(180deg, var(--wood-light) 0%, var(--wood-mid) 55%, var(--wood-dark) 100%);
      border: 2px solid #cfa378;
      box-shadow:
        0 18px 36px rgba(92, 29, 54, 0.22),
        0 5px 0 #b88758,
        inset 0 3px 6px rgba(255, 255, 255, 0.72),
        inset 0 -4px 8px rgba(139, 90, 43, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transform-origin: center bottom;
    }

    /* Dekoracyjne kropki na końcach patyczka */
    .wooden-stick::before,
    .wooden-stick::after {
      content: "♥";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: rgba(138, 69, 44, 0.45);
    }

    .wooden-stick::before {
      left: 16px;
    }

    .wooden-stick::after {
      right: 16px;
    }

    .stick-text {
      font-size: clamp(1.18rem, 4.7vw, 1.45rem);
      font-weight: 700;
      line-height: 1.35;
      color: var(--wood-ink);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
      word-break: break-word;
    }

    /* Animacja wysuwania patyczka ze słoika */
    .stick-slide-in {
      animation: stickEmerge 0.65s cubic-bezier(0.22, 1.28, 0.36, 1) forwards;
    }

    @keyframes stickEmerge {
      0% {
        opacity: 0;
        transform: translateY(85px) scale(0.68) rotate(-8deg);
      }
      65% {
        opacity: 1;
        transform: translateY(-8px) scale(1.03) rotate(1.5deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
    }

    /* Przycisk ponownego losowania pod patyczkiem */
    .secondary-action-btn {
      margin-top: 26px;
      padding: 16px 34px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      background: linear-gradient(145deg, #ff669e 0%, var(--pink-primary) 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px var(--pink-glow);
      transition: transform 0.18s ease, opacity 0.2s ease;
    }

    .secondary-action-btn:active {
      transform: scale(0.94);
    }

    /* ==========================================================================
       EKRAN WYCZERPANIA PULI (WSZYSTKIE 53 PATYCZKI WYLOSOWANE)
       ========================================================================== */
    .empty-jar-card {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid var(--glass-border);
      border-radius: 32px;
      padding: 30px 24px;
      box-shadow: 0 16px 36px rgba(214, 70, 122, 0.18);
      animation: stickEmerge 0.55s ease forwards;
    }

    .empty-jar-card.visible {
      display: flex;
    }

    .empty-jar-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .empty-jar-desc {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.45;
      color: rgba(92, 29, 54, 0.85);
    }

    .reset-btn {
      padding: 16px 28px;
      border-radius: 999px;
      border: 2px solid #fff;
      background: linear-gradient(145deg, #ff669e 0%, var(--pink-primary) 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px var(--pink-glow);
      transition: transform 0.18s ease;
    }

    .reset-btn:active {
      transform: scale(0.94);
    }

    /* ==========================================================================
       WARSTWA ROZBŁYSKU SERDUSZEK (PARTICLES)
       ========================================================================== */
    .burst-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .burst-heart {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: 1.5rem;
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* Dyskretna stopka */
    .footer-note {
      font-size: 0.82rem;
      font-weight: 700;
      color: rgba(92, 29, 54, 0.55);
      text-align: center;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <!-- Tło z pływającymi serduszkami -->
  <div class="floating-hearts-layer" id="floatingHearts" aria-hidden="true"></div>

  <!-- Warstwa rozbłysku serduszek po wylosowaniu patyczka -->
  <div class="burst-layer" id="burstLayer" aria-hidden="true"></div>

  <!-- Główny widok aplikacji -->
  <main class="app-shell">
    <!-- Górny pasek z licznikiem oraz przełącznikiem dźwięku -->
    <header class="top-bar">
      <div class="counter-pill" id="counterPill" aria-live="polite">
        <span>🫙</span>
        <span id="counterText">W słoiku: 53 / 53</span>
      </div>

      <button
        type="button"
        class="sound-btn"
        id="soundToggleBtn"
        aria-label="Przełącz dźwięk"
        title="Dźwięk"
      >
        🔊
      </button>
    </header>

    <!-- Centralna część ekranu -->
    <section class="center-stage">
      <!-- Stan 1: Ekran startowy z centralnym przyciskiem "Losuj" -->
      <div id="startView" style="display: flex; flex-direction: column; align-items: center; gap: 22px;">
        <div class="jar-emblem" id="jarEmblem">
          <!-- Ilustracja uroczego słoiczka ze SVG -->
          <svg class="jar-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- Zakrętka -->
            <rect x="28" y="12" width="44" height="11" rx="5.5" fill="#ff7aa8" stroke="#ffffff" stroke-width="2.5"/>
            <!-- Wystające końcówki patyczków -->
            <rect x="36" y="21" width="7" height="22" rx="3.5" transform="rotate(-14 36 21)" fill="#ebd0b0" stroke="#cfa378" stroke-width="1.5"/>
            <rect x="48" y="19" width="7" height="24" rx="3.5" transform="rotate(6 48 19)" fill="#f6dec3" stroke="#cfa378" stroke-width="1.5"/>
            <rect x="57" y="21" width="7" height="22" rx="3.5" transform="rotate(18 57 21)" fill="#d9b38c" stroke="#cfa378" stroke-width="1.5"/>
            <!-- Szklany korpus słoika -->
            <rect x="20" y="24" width="60" height="64" rx="20" fill="rgba(255, 255, 255, 0.68)" stroke="#ffffff" stroke-width="3"/>
            <!-- Serduszko na słoiku -->
            <path d="M50 67C50 67 34 56.5 34 46.5C34 41.8 37.8 38 42.5 38C45.3 38 47.9 39.4 50 41.7C52.1 39.4 54.7 38 57.5 38C62.2 38 66 41.8 66 46.5C66 56.5 50 67 50 67Z" fill="#ff4d8d"/>
          </svg>
          <p class="subtitle-hint">Kliknij i wyciągnij swój patyczek 💕</p>
        </div>

        <button type="button" class="draw-button" id="drawBtn">
          Losuj
        </button>
      </div>

      <!-- Stan 2: Wylosowany drewniany patyczek -->
      <div class="stick-wrapper" id="stickView">
        <div class="wooden-stick" id="woodenStick" role="button" tabindex="0" aria-label="Wylosowany patyczek">
          <p class="stick-text" id="stickText"></p>
        </div>

        <button type="button" class="secondary-action-btn" id="drawAnotherBtn">
          Losuj kolejny ✨
        </button>
      </div>

      <!-- Stan 3: Wszystkie 53 patyczki zostały już wylosowane -->
      <div class="empty-jar-card" id="emptyJarView">
        <div style="font-size: 3rem;">🥹💖</div>
        <h2 class="empty-jar-title">Słoiczek jest już pusty!</h2>
        <p class="empty-jar-desc">
          Wylosowałaś wszystkie 53 wiadomości pełne miłości. Chcesz włożyć patyczki z powrotem i losować od nowa?
        </p>
        <button type="button" class="reset-btn" id="resetJarBtn">
          Włóż patyczki z powrotem 🔄
        </button>
      </div>
    </section>

    <!-- Dyskretna stopka -->
    <footer class="footer-note">
      Stworzone specjalnie dla Ciebie ❤️
    </footer>
  </main>

  <script>

    /**
     * ==========================================================================
     * KLUCZE LOCALSTORAGE I STAN APLIKACJI
     * ==========================================================================
     */
    const STORAGE_KEY_DRAWN = "sloik_patyczki_wylosowane_v1";
    const STORAGE_KEY_SOUND = "sloik_patyczki_dzwiek_v1";

    let drawnIndices = [];
    let soundEnabled = true;
    let isAnimating = false;

    // Referencje do elementów DOM
    const counterPill = document.getElementById("counterPill");
    const counterText = document.getElementById("counterText");
    const soundToggleBtn = document.getElementById("soundToggleBtn");
    const startView = document.getElementById("startView");
    const jarEmblem = document.getElementById("jarEmblem");
    const drawBtn = document.getElementById("drawBtn");
    const stickView = document.getElementById("stickView");
    const woodenStick = document.getElementById("woodenStick");
    const stickText = document.getElementById("stickText");
    const drawAnotherBtn = document.getElementById("drawAnotherBtn");
    const emptyJarView = document.getElementById("emptyJarView");
    const resetJarBtn = document.getElementById("resetJarBtn");
    const burstLayer = document.getElementById("burstLayer");
    const floatingHearts = document.getElementById("floatingHearts");

    /**
     * ==========================================================================
     * SILNIK DŹWIĘKU OPARTY NA WEB AUDIO API (BEZ ZEWNĘTRZNYCH PLIKÓW)
     * ==========================================================================
     */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume().catch(() => {});
        }
      }

      // Delikatne stukanie drewnianych patyczków podczas potrząsania
      playWoodRattle() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;

        const tapOffsets = [0, 0.11, 0.22, 0.34, 0.46, 0.57];
        tapOffsets.forEach((offset, idx) => {
          const now = this.ctx.currentTime + offset;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = "triangle";
          const baseFreq = 260 + (idx % 3) * 55;
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.055);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.065);
        });
      }

      // Ciepły, magiczny akord przy odkryciu wiadomości
      playRevealChime() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;

        // Nuty C5, E5, G5, B5, D6 (romantyczny akord Cmaj9)
        const notes = [523.25, 659.25, 783.99, 987.77, 1174.66];
        notes.forEach((freq, i) => {
          const start = this.ctx.currentTime + i * 0.065;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.12, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.85);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(start);
          osc.stop(start + 0.9);
        });
      }

      // Dźwięk ponownego napełnienia słoika
      playResetSound() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;

        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, i) => {
          const start = this.ctx.currentTime + i * 0.055;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.1, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.45);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(start);
          osc.stop(start + 0.5);
        });
      }
    }

    const sound = new SoundEngine();

    /**
     * ==========================================================================
     * OBSŁUGA LOCALSTORAGE (Z ZABEZPIECZENIEM TRY/CATCH)
     * ==========================================================================
     */
    function loadState() {
      try {
        const savedDrawn = localStorage.getItem(STORAGE_KEY_DRAWN);
        if (savedDrawn) {
          const parsed = JSON.parse(savedDrawn);
          if (Array.isArray(parsed)) {
            // Filtrujemy tylko poprawne indeksy z zakresu 0..52
            drawnIndices = parsed.filter(
              (idx) => Number.isInteger(idx) && idx >= 0 && idx < PATYCZKI.length
            );
          }
        }

        const savedSound = localStorage.getItem(STORAGE_KEY_SOUND);
        if (savedSound !== null) {
          soundEnabled = savedSound === "true";
        }
      } catch (e) {
        drawnIndices = [];
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY_DRAWN, JSON.stringify(drawnIndices));
        localStorage.setItem(STORAGE_KEY_SOUND, String(soundEnabled));
      } catch (e) {
        // Ignorujemy błędy np. w trybie prywatnym Safari
      }
    }

    /**
     * ==========================================================================
     * GENEROWANIE PŁYWAJĄCYCH SERDUSZEK W TLE
     * ==========================================================================
     */
    function createBackgroundHearts() {
      const heartSymbols = ["❤️", "💕", "💗", "💖", "🌸"];
      const count = 18;

      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "bg-heart";
        el.textContent = heartSymbols[i % heartSymbols.length];

        const leftPos = Math.random() * 100;
        const size = 14 + Math.random() * 18;
        const duration = 11 + Math.random() * 12;
        const delay = -(Math.random() * 20);
        const drift = (Math.random() - 0.5) * 70;

        el.style.left = `${leftPos}%`;
        el.style.fontSize = `${size}px`;
        el.style.animationDuration = `${duration}s`;
        el.style.animationDelay = `${delay}s`;
        el.style.setProperty("--drift", `${drift}px`);

        floatingHearts.appendChild(el);
      }
    }

    /**
     * ==========================================================================
     * EFEKT ROZBŁYSKU SERDUSZEK PRZY WYLOSOWANIU
     * ==========================================================================
     */
    function triggerHeartBurst() {
      const emojis = ["❤️", "💖", "💕", "💗", "✨", "🥰"];
      const total = 26;

      for (let i = 0; i < total; i++) {
        const particle = document.createElement("span");
        particle.className = "burst-heart";
        particle.textContent = emojis[i % emojis.length];

        const angle = (Math.PI * 2 * i) / total + (Math.random() - 0.5) * 0.35;
        const distance = 95 + Math.random() * 165;
        const destX = Math.cos(angle) * distance;
        const destY = Math.sin(angle) * distance - 25;
        const rotation = (Math.random() - 0.5) * 90;
        const scale = 0.75 + Math.random() * 0.75;

        burstLayer.appendChild(particle);

        const anim = particle.animate(
          [
            {
              transform: "translate(-50%, -50%) scale(0.2) rotate(0deg)",
              opacity: 1
            },
            {
              transform: `translate(calc(-50% + ${destX * 0.75}px), calc(-50% + ${destY * 0.75}px)) scale(${scale}) rotate(${rotation * 0.6}deg)`,
              opacity: 1,
              offset: 0.65
            },
            {
              transform: `translate(calc(-50% + ${destX}px), calc(-50% + ${destY + 25}px)) scale(${scale * 0.85}) rotate(${rotation}deg)`,
              opacity: 0
            }
          ],
          {
            duration: 850 + Math.random() * 300,
            easing: "cubic-bezier(0.16, 1, 0.3, 1)",
            fill: "forwards"
          }
        );

        anim.onfinish = () => particle.remove();
      }
    }

    /**
     * ==========================================================================
     * AKTUALIZACJA INTERFEJSU I LOGIKA LOSOWANIA
     * ==========================================================================
     */
    function updateCounterUI(animateBump = false) {
      const remaining = PATYCZKI.length - drawnIndices.length;
      counterText.textContent = `W słoiku: ${remaining} / ${PATYCZKI.length}`;

      if (animateBump) {
        counterPill.classList.remove("bump");
        void counterPill.offsetWidth;
        counterPill.classList.add("bump");
        setTimeout(() => counterPill.classList.remove("bump"), 260);
      }
    }

    function updateSoundUI() {
      soundToggleBtn.textContent = soundEnabled ? "🔊" : "🔇";
      soundToggleBtn.setAttribute(
        "aria-label",
        soundEnabled ? "Wyłącz dźwięk" : "Włącz dźwięk"
      );
    }

    function getAvailableIndices() {
      const available = [];
      for (let i = 0; i < PATYCZKI.length; i++) {
        if (!drawnIndices.includes(i)) {
          available.push(i);
        }
      }
      return available;
    }

    function performDraw() {
      if (isAnimating) return;

      const available = getAvailableIndices();
      if (available.length === 0) {
        showEmptyJarState();
        return;
      }

      isAnimating = true;
      drawBtn.disabled = true;
      drawAnotherBtn.disabled = true;

      // Dźwięk potrząsania patyczkami
      sound.playWoodRattle();

      // Potrząsamy aktualnie widocznym elementem (przyciskiem "Losuj" lub patyczkiem)
      const isFirstScreen = startView.style.display !== "none";
      if (isFirstScreen) {
        jarEmblem.classList.add("is-shaking");
        drawBtn.classList.add("is-shaking");
      } else {
        woodenStick.classList.add("is-shaking");
      }

      // Po zakończeniu animacji potrząsania wysuwamy wylosowany patyczek
      setTimeout(() => {
        jarEmblem.classList.remove("is-shaking");
        drawBtn.classList.remove("is-shaking");
        woodenStick.classList.remove("is-shaking");

        // Losowanie bez powtórek z dostępnej puli
        const randomPos = Math.floor(Math.random() * available.length);
        const chosenIndex = available[randomPos];

        drawnIndices.push(chosenIndex);
        saveState();
        updateCounterUI(true);

        // Przełączenie widoku na drewniany patyczek
        startView.style.display = "none";
        emptyJarView.classList.remove("visible");
        stickView.classList.add("visible");

        stickText.textContent = PATYCZKI[chosenIndex];

        // Restart animacji wysuwania patyczka
        woodenStick.classList.remove("stick-slide-in");
        void woodenStick.offsetWidth;
        woodenStick.classList.add("stick-slide-in");

        // Jeśli to był ostatni (53.) patyczek, zmieniamy napis dolnego przycisku
        const leftNow = PATYCZKI.length - drawnIndices.length;
        drawAnotherBtn.textContent =
          leftNow === 0 ? "Zakończ losowanie 💝" : "Losuj kolejny ✨";

        // Rozbłysk serduszek i dźwięk odkrycia
        triggerHeartBurst();
        sound.playRevealChime();

        drawBtn.disabled = false;
        drawAnotherBtn.disabled = false;
        isAnimating = false;
      }, 680);
    }

    function showEmptyJarState() {
      startView.style.display = "none";
      stickView.classList.remove("visible");
      emptyJarView.classList.add("visible");
      triggerHeartBurst();
    }

    function resetJar() {
      drawnIndices = [];
      saveState();
      updateCounterUI(true);
      sound.playResetSound();
      triggerHeartBurst();

      emptyJarView.classList.remove("visible");
      stickView.classList.remove("visible");
      startView.style.display = "flex";
    }

    /**
     * ==========================================================================
     * INICJALIZACJA I NASŁUCHIWANIE ZDARZEŃ
     * ==========================================================================
     */
    window.addEventListener("DOMContentLoaded", () => {
      loadState();
      createBackgroundHearts();
      updateCounterUI(false);
      updateSoundUI();

      // Jeśli przy starcie słoik jest już pusty, pokaż ekran podsumowania
      if (drawnIndices.length >= PATYCZKI.length) {
        startView.style.display = "none";
        emptyJarView.classList.add("visible");
      }

      // Kliknięcie głównego przycisku "Losuj"
      drawBtn.addEventListener("click", performDraw);

      // Kliknięcie przycisku "Losuj kolejny"
      drawAnotherBtn.addEventListener("click", () => {
        if (getAvailableIndices().length === 0) {
          showEmptyJarState();
        } else {
          performDraw();
        }
      });

      // Kliknięcie samego patyczka daje dodatkowy rozbłysk serduszek
      woodenStick.addEventListener("click", () => {
        if (isAnimating) return;
        woodenStick.classList.remove("is-shaking");
        void woodenStick.offsetWidth;
        woodenStick.classList.add("is-shaking");
        triggerHeartBurst();
        sound.playRevealChime();
        setTimeout(() => woodenStick.classList.remove("is-shaking"), 680);
      });

      // Przycisk ponownego włożenia patyczków do słoika
      resetJarBtn.addEventListener("click", resetJar);

      // Przełącznik dźwięku
      soundToggleBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        saveState();
        updateSoundUI();
        if (soundEnabled) {
          sound.playRevealChime();
        }
      });
    });
  </script>
</body>
