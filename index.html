<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Patyczki dla Ciebie ❤️</title>

  <!-- Ustawienia PWA dla iPhone (tryb pełnoekranowy bez paska Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Patyczki ❤️" />
  <meta name="theme-color" content="#ffd6e5" />
  <link rel="apple-touch-icon" href="ikona.jpeg" />

  <!-- Czcionka z pełnym wsparciem polskich znaków -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-top: #ffe4ee;
      --bg-mid: #ffc8dd;
      --bg-bot: #ffafcc;
      --accent: #e63973;
      --accent-dark: #c92a60;
      --wood-1: #f6dcb8;
      --wood-2: #edd0a6;
      --wood-3: #e2be8d;
      --wood-border: #cfa46e;
      --wood-text: #5c3a21;
      --gold-1: #fff6cc;
      --gold-2: #ffe07d;
      --gold-3: #f6be4f;
      --gold-border: #d99326;
      --gold-text: #5e3800;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bot) 100%);
      color: #6b213c;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 14px);
      position: relative;
    }

    /* Subtelne pływające serduszka w tle */
    .bg-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-heart {
      position: absolute;
      bottom: -40px;
      font-size: 20px;
      opacity: 0.25;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg) scale(0.9); opacity: 0; }
      15% { opacity: 0.28; }
      85% { opacity: 0.22; }
      100% { transform: translateY(-110vh) rotate(25deg) scale(1.1); opacity: 0; }
    }

    /* Górny pasek: Ulubione po lewej, Dźwięk po prawej */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      max-width: 440px;
    }

    .pill-btn {
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #8f2d52;
      box-shadow: 0 4px 15px rgba(230, 57, 115, 0.12);
      transition: transform 0.15s ease;
    }

    .pill-btn:active {
      transform: scale(0.94);
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #8f2d52;
      box-shadow: 0 4px 15px rgba(230, 57, 115, 0.12);
      transition: transform 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* Baner rocznicowy */
    .anniversary-banner {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 9px 22px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff4d88 0%, #e63973 50%, #ff4d88 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      box-shadow:
        0 8px 22px rgba(230, 57, 115, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.55);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      z-index: 4;
      animation: bannerPulse 2.2s ease-in-out infinite;
    }

    .anniversary-banner.show {
      display: flex;
    }

    @keyframes bannerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* Główna strefa centralna */
    main {
      flex: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      gap: 20px;
      padding-bottom: 58px;
    }

    main.no-pull-pad {
      padding-bottom: 0;
    }

    /* Scena prezentacji */
    .stage {
      width: 100%;
      min-height: 205px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .jar-glow {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0) 72%);
      pointer-events: none;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .jar-glow.pulse {
      animation: glowPulse 0.7s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from { transform: scale(0.95); opacity: 0.7; }
      to { transform: scale(1.22); opacity: 1; }
    }

    /* Ramka Polaroid na wspólne zdjęcie */
    .photo-card {
      display: none;
      background: #ffffff;
      padding: 12px 12px 36px 12px;
      border-radius: 18px;
      box-shadow:
        0 16px 34px rgba(138, 43, 77, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.06);
      transform: translateY(30px) scale(0.84) rotate(1.5deg);
      opacity: 0;
      transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.22, 1.25, 0.36, 1);
      cursor: zoom-in;
      position: relative;
      z-index: 3;
    }

    .photo-card.active {
      display: block;
    }

    .photo-card.visible {
      opacity: 1;
      transform: translateY(0) scale(1) rotate(1.5deg);
    }

    .photo-card img {
      width: 230px;
      height: 230px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      background: #ffe4ee;
    }

    .photo-caption {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      color: #b5486e;
      letter-spacing: 0.3px;
    }

    /* Drewniany lub złoty patyczek */
    .stick-wrapper {
      width: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(35px) scale(0.84) rotate(-4deg);
      transition: opacity 0.35s ease, transform 0.55s cubic-bezier(0.22, 1.25, 0.36, 1);
      z-index: 3;
    }

    .stick-wrapper.active {
      display: flex;
    }

    .stick-wrapper.visible {
      opacity: 1;
      transform: translateY(0) scale(1) rotate(-1.5deg);
    }

    .stick-wrapper.drawing {
      display: flex;
      animation: stickShuffle 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes stickShuffle {
      0%   { opacity: 0.9; transform: translateY(16px) scale(0.85) rotate(-8deg); }
      20%  { opacity: 1;   transform: translateY(-16px) scale(0.92) rotate(7deg); }
      40%  { opacity: 1;   transform: translateY(10px) scale(0.95) rotate(-6deg); }
      60%  { opacity: 1;   transform: translateY(-12px) scale(0.97) rotate(5deg); }
      80%  { opacity: 1;   transform: translateY(6px) scale(0.99) rotate(-3deg); }
      100% { opacity: 0;   transform: translateY(-20px) scale(0.9) rotate(0deg); }
    }

    .golden-tag {
      display: none;
      padding: 4px 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffe98a 0%, #f5b935 100%);
      border: 1.5px solid #fff8d6;
      color: #633b00;
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(217, 147, 38, 0.35);
    }

    .stick-wrapper.is-golden .golden-tag {
      display: inline-block;
    }

    .popsicle-stick {
      position: relative;
      width: 100%;
      max-width: 365px;
      min-height: 92px;
      padding: 20px 34px;
      border-radius: 999px;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(185, 134, 75, 0.06) 0px,
          rgba(185, 134, 75, 0.06) 2px,
          transparent 2px,
          transparent 9px
        ),
        linear-gradient(180deg, var(--wood-1) 0%, var(--wood-2) 55%, var(--wood-3) 100%);
      border: 2px solid var(--wood-border);
      box-shadow:
        0 14px 28px rgba(138, 43, 77, 0.22),
        0 4px 0 #c5965d,
        inset 0 2px 4px rgba(255, 255, 255, 0.75),
        inset 0 -3px 6px rgba(168, 118, 62, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    /* Złoty wariant patyczka */
    .stick-wrapper.is-golden .popsicle-stick {
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0) 25%, rgba(255, 255, 255, 0.65) 50%, rgba(255, 255, 255, 0) 75%),
        linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 52%, var(--gold-3) 100%);
      background-size: 220% 100%, 100% 100%;
      border: 2.5px solid var(--gold-border);
      box-shadow:
        0 16px 34px rgba(217, 147, 38, 0.42),
        0 4px 0 #c47f17,
        inset 0 2px 6px rgba(255, 255, 255, 0.9),
        inset 0 -3px 6px rgba(184, 118, 14, 0.25);
      animation: goldShimmer 2.8s ease-in-out infinite;
    }

    @keyframes goldShimmer {
      0% { background-position: 200% 0, 0 0; }
      100% { background-position: -200% 0, 0 0; }
    }

    .popsicle-stick::before,
    .popsicle-stick::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(168, 118, 62, 0.22);
      box-shadow: inset 0 1px 2px rgba(92, 58, 33, 0.25);
    }

    .stick-wrapper.is-golden .popsicle-stick::before,
    .stick-wrapper.is-golden .popsicle-stick::after {
      background: rgba(184, 118, 14, 0.28);
    }

    .popsicle-stick::before { left: 16px; }
    .popsicle-stick::after { right: 16px; }

    .stick-text {
      font-size: 20.5px;
      font-weight: 800;
      line-height: 1.3;
      color: var(--wood-text);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      word-break: break-word;
    }

    .stick-wrapper.is-golden .stick-text {
      color: var(--gold-text);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .stick-text.long-text {
      font-size: 17px;
    }

    /* Przycisk zapisu do Ulubionych pod aktualnym wynikiem */
    .fav-action-btn {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      color: #9e2d56;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(230, 57, 115, 0.14);
      transition: transform 0.15s ease, background 0.2s ease;
      z-index: 4;
    }

    .fav-action-btn.show {
      display: inline-flex;
    }

    .fav-action-btn.saved {
      background: #ffe0ec;
      border-color: #ff8fb8;
      color: #c92a60;
    }

    .fav-action-btn:active {
      transform: scale(0.94);
    }

    /* Strefa przycisku "Losuj" i limitu dziennego */
    .controls-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .draw-btn {
      position: relative;
      min-width: 215px;
      height: 70px;
      padding: 0 44px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff5c93 0%, var(--accent) 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow:
        0 12px 26px rgba(230, 57, 115, 0.38),
        0 5px 0 var(--accent-dark),
        inset 0 2px 3px rgba(255, 255, 255, 0.45);
      transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .draw-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow:
        0 6px 14px rgba(230, 57, 115, 0.32),
        0 1px 0 var(--accent-dark),
        inset 0 2px 3px rgba(255, 255, 255, 0.35);
    }

    .draw-btn:disabled {
      cursor: default;
      filter: saturate(0.85);
    }

    .draw-btn.shaking {
      animation: btnShake 0.65s ease-in-out;
    }

    @keyframes btnShake {
      0%, 100% { transform: scale(1) rotate(0deg); }
      15% { transform: scale(1.05) rotate(-4deg); }
      30% { transform: scale(1.05) rotate(4deg); }
      45% { transform: scale(1.05) rotate(-4deg); }
      60% { transform: scale(1.05) rotate(4deg); }
      75% { transform: scale(1.03) rotate(-2deg); }
    }

    .daily-hint {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      color: #8f2d52;
    }

    /* Komunikat po wykorzystaniu 3 losowań na dziś */
    .limit-card {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      padding: 15px 22px;
      box-shadow: 0 10px 26px rgba(230, 57, 115, 0.16);
      max-width: 340px;
      gap: 4px;
    }

    .limit-card.show {
      display: flex;
      animation: popIn 0.4s cubic-bezier(0.22, 1.25, 0.36, 1);
    }

    .limit-card strong {
      font-size: 16px;
      font-weight: 900;
      color: #c92a60;
    }

    .limit-card span {
      font-size: 14px;
      font-weight: 700;
      color: #7d2244;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Wystający z dołu patyczek do wyciągania gestem Swipe Up */
    .pull-dock {
      position: fixed;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 68px;
      height: 92px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      touch-action: none;
    }

    .pull-dock.hidden {
      display: none;
    }

    .pull-stick-tip {
      width: 52px;
      height: 96px;
      border-radius: 26px 26px 8px 8px;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(185, 134, 75, 0.08) 0px,
          rgba(185, 134, 75, 0.08) 2px,
          transparent 2px,
          transparent 8px
        ),
        linear-gradient(90deg, var(--wood-1) 0%, var(--wood-2) 55%, var(--wood-3) 100%);
      border: 2px solid var(--wood-border);
      box-shadow:
        0 -6px 18px rgba(138, 43, 77, 0.2),
        inset 0 2px 4px rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      gap: 2px;
      transition: transform 0.25s cubic-bezier(0.22, 1.25, 0.36, 1);
      animation: gentleNudge 2.6s ease-in-out infinite;
    }

    .pull-dock.dragging .pull-stick-tip {
      animation: none;
      transition: none;
    }

    @keyframes gentleNudge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .pull-arrow {
      font-size: 13px;
      font-weight: 900;
      color: #8c5a32;
      line-height: 1;
    }

    .pull-label {
      font-size: 9.5px;
      font-weight: 900;
      color: #8c5a32;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Modal Ulubionych */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(58, 16, 33, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 40;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 82dvh;
      background: linear-gradient(180deg, #fff5f9 0%, #ffe6f0 100%);
      border-radius: 28px 28px 0 0;
      padding: 20px 20px calc(env(safe-area-inset-bottom) + 24px);
      box-shadow: 0 -12px 36px rgba(92, 23, 50, 0.25);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: slideUpSheet 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideUpSheet {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(230, 57, 115, 0.15);
    }

    .modal-header h2 {
      font-size: 19px;
      font-weight: 900;
      color: #8f2d52;
    }

    .fav-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .fav-empty {
      text-align: center;
      padding: 36px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #9e4768;
      line-height: 1.5;
    }

    .fav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: 0 4px 12px rgba(230, 57, 115, 0.08);
    }

    .fav-item.golden {
      background: linear-gradient(135deg, #fff9db 0%, #ffe699 100%);
      border-color: #eab338;
    }

    .fav-item-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .fav-thumb {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      cursor: zoom-in;
      flex-shrink: 0;
    }

    .fav-item-text {
      font-size: 14.5px;
      font-weight: 800;
      color: #5c3a21;
      line-height: 1.35;
      word-break: break-word;
    }

    .fav-item.golden .fav-item-text {
      color: #633b00;
    }

    .fav-del-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(230, 57, 115, 0.1);
      color: #b53864;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Podgląd zdjęcia na pełnym ekranie po kliknięciu */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(45, 12, 25, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 60;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 82dvh;
      border-radius: 18px;
      border: 6px solid #ffffff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      object-fit: contain;
    }

    /* Cząsteczki po wylosowaniu */
    .particle {
      position: fixed;
      pointer-events: none;

    const LIMIT_DZIENNY = 3;

    function getTodayKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getMonthKey() {
      return getTodayKey().slice(0, 7); // "YYYY-MM"
    }

    function getMonthDayKey() {
      return getTodayKey().slice(5, 10); // "MM-DD"
    }

    function loadGoldenMonthState() {
      const currentMonth = getMonthKey();
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_GOLDEN_MONTH) || "null");
        if (saved && saved.month === currentMonth && Array.isArray(saved.drawn)) {
          return {
            month: currentMonth,
            drawn: saved.drawn.filter(i => Number.isInteger(i) && i >= 0 && i < ZLOTE_KUPONY.length)
          };
        }
      } catch (e) {}
      return { month: currentMonth, drawn: [] };
    }

    function loadDailyState() {
      const today = getTodayKey();
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_DAILY_KEY) || "null");
        if (saved && saved.date === today) {
          return {
            date: today,
            count: Math.min(LIMIT_DZIENNY, Math.max(0, Number(saved.count) || 0)),
            lastItem: saved.lastItem || null
          };
        }
      } catch (e) {}
      return { date: today, count: 0, lastItem: null };
    }

    let goldenMonthState = loadGoldenMonthState();

    function initBgHearts() {

      const icons = ["💗", "💖", "💕", "🌸", "✨"];

        container.appendChild(el);
      }
    }

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playWoodTap(delay = 0, freq = 260) {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const t = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(110, t + 0.06);

      gain.gain.setValueAtTime(0.14, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.08);
    }

    function playRevealChime(isGolden = false) {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const notes = isGolden
        ? [523.25, 659.25, 783.99, 1046.5, 1318.51]
        : [523.25, 659.25, 783.99, 1046.5];

      notes.forEach((freq, idx) => {
        const t = ctx.currentTime + idx * 0.065;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = isGolden ? "triangle" : "sine";
        osc.frequency.setValueAtTime(freq, t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(isGolden ? 0.15 : 0.12, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.48);
      });
    }

    function spawnParticles(targetEl, isGolden = false) {
      const rect = targetEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const emojis = isGolden
        ? ["✨", "💛", "🌟", "👑", "🎟️"]
        : ["❤️", "💖", "✨", "🥰", "💕"];

      for (let i = 0; i < 14; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.textContent = emojis[i % emojis.length];
        const angle = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5) * 0.4;
        const dist = 65 + Math.random() * 90;
        p.style.left = `${cx}px`;
        p.style.top = `${cy}px`;
        p.style.setProperty("--tx", `${Math.cos(angle) * dist}px`);
        p.style.setProperty("--ty", `${Math.sin(angle) * dist - 20}px`);
        p.style.setProperty("--rot", `${(Math.random() - 0.5) * 70}deg`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
      }
    }

      return favorites.some(f => f.type === item.type && f.value === item.value);

      localStorage.setItem(STORAGE_FAVS_KEY, JSON.stringify(favorites));
      updateFavActionBtn();

    }

        const row = document.createElement("div");
        row.className = "fav-item" + (item.type === "golden" ? " golden" : "");

        const content = document.createElement("div");
        content.className = "fav-item-content";

        if (item.type === "photo") {
          const img = document.createElement("img");
          img.className = "fav-thumb";
          img.src = item.value;
          img.alt = "Ulubione zdjęcie";
          img.addEventListener("click", () => {

          const label = document.createElement("div");

          label.textContent = "Nasze wspólne zdjęcie ❤️";
          content.appendChild(img);
          content.appendChild(label);
        } else {
          const text = document.createElement("div");
          text.className = "fav-item-text";
          text.textContent = item.value;
          content.appendChild(text);
        }

        const delBtn = document.createElement("button");
        delBtn.className = "fav-del-btn";
        delBtn.textContent = "✕";
        delBtn.title = "Usuń z ulubionych";
        delBtn.addEventListener("click", () => {
          favorites.splice(index, 1);

          renderFavoritesList();
          updateFavActionBtn();
          updateFavHeaderBadge();
        });

        row.appendChild(content);
        row.appendChild(delBtn);
        favList.appendChild(row);
      });
    }

    function hideAllResults() {
      photoCard.classList.remove("active", "visible");
      stickWrapper.classList.remove("active", "visible", "is-golden");
      favActionBtn.classList.remove("show");
    }

    function showStickOnly(message, isGolden = false, animate = true) {
      photoCard.classList.remove("active", "visible");
      stickWrapper.classList.toggle("is-golden", isGolden);
      stickText.textContent = message;
      stickText.classList.toggle("long-text", message.length > 34);
      const tilt = (Math.random() * 3.4 - 1.7).toFixed(2);
      stickWrapper.classList.add("active");

      if (animate) {
        stickWrapper.classList.remove("visible");
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            stickWrapper.classList.add("visible");
            stickWrapper.style.transform = `translateY(0) scale(1) rotate(${tilt}deg)`;
          });
        });
      } else {
        stickWrapper.classList.add("visible");
        stickWrapper.style.transform = `translateY(0) scale(1) rotate(${tilt}deg)`;
      }
      updateFavActionBtn();
    }

    function showPhotoOnly(src, animate = true) {
      stickWrapper.classList.remove("active", "visible", "is-golden");
      const tilt = (Math.random() * 4 - 2).toFixed(2);

      const loader = new Image();
      loader.onload = () => {
        photoImg.src = src;
        lightboxImg.src = src;
        photoCard.classList.add("active");
        if (animate) {
          photoCard.classList.remove("visible");
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              photoCard.classList.add("visible");
              photoCard.style.transform = `translateY(0) scale(1) rotate(${tilt}deg)`;
            });
          });
        } else {
          photoCard.classList.add("visible");
          photoCard.style.transform = `translateY(0) scale(1) rotate(${tilt}deg)`;
        }
        updateFavActionBtn();
      };
      loader.onerror = () => {
        const fallback = PATYCZKI[Math.floor(Math.random() * PATYCZKI.length)];
        currentDisplayedItem = { type: "text", value: fallback };
        showStickOnly(fallback, false, animate);
      };
      loader.src = src;
    }

    function renderItem(item, animate = true) {
      if (!item) return;
      currentDisplayedItem = item;
      if (item.type === "photo") {
        showPhotoOnly(item.value, animate);
      } else if (item.type === "golden") {
        showStickOnly(item.value, true, animate);
      } else {
        showStickOnly(item.value, false, animate);
      }
    }

    function updateUI() {
      checkAnniversary();
      dailyState = loadDailyState();
      goldenMonthState = loadGoldenMonthState();
      soundToggle.textContent = soundEnabled ? "🔊" : "🔇";
      updateFavHeaderBadge();

      const leftToday = Math.max(0, LIMIT_DZIENNY - dailyState.count);

      if (leftToday === 0) {
        drawBtn.style.display = "none";
        dailyHint.style.display = "none";
        limitCard.classList.add("show");
        pullDock.classList.add("hidden");
        mainArea.classList.add("no-pull-pad");
      } else {
        drawBtn.style.display = "flex";
        dailyHint.style.display = "block";
        limitCard.classList.remove("show");
        pullDock.classList.remove("hidden");
        mainArea.classList.remove("no-pull-pad");
        const word = leftToday === 1 ? "losowanie" : "losowania";
        dailyHint.textContent = `Dziś pozostało: ${leftToday} z ${LIMIT_DZIENNY} ${word} 💕`;
      }
    }

    function pickNextItem() {
      goldenMonthState = loadGoldenMonthState();

      // Dostępne złote kupony w bieżącym miesiącu
      const availableGolden = [];
      for (let i = 0; i < ZLOTE_KUPONY.length; i++) {
        if (!goldenMonthState.drawn.includes(i)) availableGolden.push(i);
      }

      // Dostępne zwykłe patyczki i zdjęcia
      let availableRegular = [];
      for (let i = 0; i < PULA_ZWYKLA.length; i++) {
        if (!drawnRegularIndices.includes(i)) availableRegular.push(i);
      }
      if (availableRegular.length === 0) {
        drawnRegularIndices = [];
        availableRegular = PULA_ZWYKLA.map((_, i) => i);
      }

      // Łączna pula ważona (dostępne złote kupony + pozostałe zwykłe losy)
      const totalWeight = availableRegular.length + availableGolden.length;
      const roll = Math.floor(Math.random() * totalWeight);

      if (roll < availableGolden.length) {
        const chosenGoldenIdx = availableGolden[roll];
        goldenMonthState.drawn.push(chosenGoldenIdx);
        localStorage.setItem(STORAGE_GOLDEN_MONTH, JSON.stringify(goldenMonthState));
        return { type: "golden", value: ZLOTE_KUPONY[chosenGoldenIdx] };
      } else {
        const regRoll = roll - availableGolden.length;
        const chosenRegIdx = availableRegular[regRoll];
        drawnRegularIndices.push(chosenRegIdx);
        localStorage.setItem(STORAGE_REGULAR_DRAWN, JSON.stringify(drawnRegularIndices));
        return PULA_ZWYKLA[chosenRegIdx];
      }
    }

    function drawItem() {
      if (isDrawing) return;

      dailyState = loadDailyState();
      if (dailyState.count >= LIMIT_DZIENNY) {
        updateUI();
        return;
      }

      isDrawing = true;
      drawBtn.disabled = true;
      drawBtn.classList.add("shaking");
      jarGlow.classList.add("pulse");

      playWoodTap(0.02, 270);
      playWoodTap(0.16, 310);
      playWoodTap(0.30, 250);
      playWoodTap(0.44, 330);

      hideAllResults();
      void stickWrapper.offsetWidth;
      stickWrapper.classList.add("drawing");

      const chosenItem = pickNextItem();

      setTimeout(() => {
        stickWrapper.classList.remove("drawing");

        dailyState = {
          date: getTodayKey(),
          count: dailyState.count + 1,
          lastItem: chosenItem
        };
        localStorage.setItem(STORAGE_DAILY_KEY, JSON.stringify(dailyState));

        renderItem(chosenItem, true);

        const isGold = chosenItem.type === "golden";
        playRevealChime(isGold);
        spawnParticles(chosenItem.type === "photo" ? photoCard : stickWrapper, isGold);

        drawBtn.classList.remove("shaking");
        jarGlow.classList.remove("pulse");
        drawBtn.disabled = false;
        isDrawing = false;

        updateUI();
      }, 680);
    }

    // Obsługa gestu Swipe Up na wystającym patyczku u dołu ekranu
    let touchStartY = 0;
    let isPulling = false;

    pullDock.addEventListener("touchstart", (e) => {
      if (isDrawing || dailyState.count >= LIMIT_DZIENNY) return;
      touchStartY = e.touches[0].clientY;
      isPulling = true;
      pullDock.classList.add("dragging");
    }, { passive: true });

    pullDock.addEventListener("touchmove", (e) => {
      if (!isPulling) return;
      const dy = e.touches[0].clientY - touchStartY;
      if (dy < 0) {
        const clamped = Math.max(-68, dy);
        pullStickTip.style.transform = `translateY(${clamped}px)`;
      }
    }, { passive: true });

    pullDock.addEventListener("touchend", (e) => {
      if (!isPulling) return;
      isPulling = false;
      pullDock.classList.remove("dragging");
      const endY = e.changedTouches[0].clientY;
      const pulledUpDistance = touchStartY - endY;
      pullStickTip.style.transform = "";

      if (pulledUpDistance > 38) {
        drawItem();
      }
    });

    pullDock.addEventListener("click", () => {
      if (!isDrawing && dailyState.count < LIMIT_DZIENNY) drawItem();
    });

    drawBtn.addEventListener("click", drawItem);
    favActionBtn.addEventListener("click", toggleCurrentFavorite);

    openFavsBtn.addEventListener("click", () => {
      renderFavoritesList();
      favModal.classList.add("open");
    });

    closeFavsBtn.addEventListener("click", () => favModal.classList.remove("open"));
    favModal.addEventListener("click", () => favModal.classList.remove("open"));

    photoCard.addEventListener("click", () => {
      if (photoImg.src) {
        lightboxImg.src = photoImg.src;
        lightbox.classList.add("open");
      }
    });

    lightbox.addEventListener("click", () => lightbox.classList.remove("open"));

    soundToggle.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem(SOUND_KEY, String(soundEnabled));
      updateUI();
      if (soundEnabled) playWoodTap(0, 320);
    });

    if (dailyState.count > 0 && dailyState.lastItem) {
      renderItem(dailyState.lastItem, false);
    }

    initBgHearts();
    updateUI();
  </script>
</body>
</html>
